# Included in every location of nginx.conf, as an add_header there would
# otherwise drop the server's.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Enforced: no other site may frame the app.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;

# Reported only (browser console), until checked against a deployment: the
# API, the identity provider and the map styles an admin configures are on
# other origins, known only at runtime. Emotion (MUI) and React set inline
# styles; tesseract.js compiles WebAssembly; PDFs and attachments are shown
# from blob: URLs.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
