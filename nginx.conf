server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed file names: cache for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Missing from nginx's mime.types; the MapLibre and pdf.js workers are
        # module workers, which the browser refuses unless served as JavaScript.
        location ~ \.mjs$ {
            default_type application/javascript;
            try_files $uri =404;
        }
    }

    # Mounted at runtime: always revalidate, and never fall back to index.html.
    location = /config.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Missing from nginx's mime.types.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html and sw.js must not be cached, so a new build is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
