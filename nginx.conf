server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Compressed on the fly; the bundle, the icon font aside, is text.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # Hashed file names: cache for good.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Missing from nginx's mime.types; the MapLibre and pdf.js workers are
        # module workers, which the browser refuses unless served as JavaScript.
        location ~ \.mjs$ {
            include /etc/nginx/snippets/headers.conf;
            add_header Cache-Control "public, immutable";
            default_type application/javascript;
            try_files $uri =404;
        }
    }

    # Mounted at runtime: always revalidate, and never fall back to index.html.
    location = /config.json {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Missing from nginx's mime.types.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html and sw.js must not be cached, so a new build is picked up.
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
